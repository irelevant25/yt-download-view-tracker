name: Build and Release

# Triggers when you push a version tag, e.g. git tag v2.1.0 && git push --tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  release:
    runs-on: windows-latest   # must be Windows — app targets Win32 portable exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # The tag names the release, but package.json names the built .exe.
      # Catch the mismatch here instead of shipping a wrongly-named artifact.
      - name: Check tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Fix with: npm version $TAG --allow-same-version && git push --delete origin v$TAG && git push origin main --tags"
            exit 1
          fi

      # Downloads yt-dlp.exe and ffmpeg suite into bin/ (gitignored, not in repo)
      # GITHUB_TOKEN lifts the anonymous api.github.com rate limit, which runners
      # hit intermittently because they share an IP pool.
      - name: Download required binaries
        run: node scripts/install-binaries.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder reads bin/ via extraFiles and packages everything
      - name: Build portable executable
        run: npx electron-builder
        env:
          # Prevents electron-builder from publishing automatically
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder deliberately produces a version-free "YouTube-Checker.exe"
      # so the local build output and the README stay stable. The published asset
      # DOES carry the version, so downloaded copies can be told apart.
      - name: Name the release asset with the version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv "dist/YouTube-Checker.exe" "dist/YouTube-Checker-${VERSION}.exe"
          ls -la dist/

      # Upload the versioned .exe to the GitHub Release created by the tag push
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YouTube-Checker-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
